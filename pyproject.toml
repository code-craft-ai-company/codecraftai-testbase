[tool.poetry]
name = "codecraftai-testbase"
description = "Code Craft AI - TestBase"
version = "1.0.2"
authors = ["Myron Walker <myron.walker@gmail.com>"]
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
codecraftai-foundations = { version = "<2.0.0", source = "codecraftai" }
codecraftai-arcli = { version = "<2.0.0", source = "codecraftai" }
codecraftai-this-app = { version = "<2.0.0", source = "codecraftai" }
codecraftai-runtime = { version = "<2.0.0", source = "codecraftai" }
codecraftai-xmodules = { version = "<2.0.0", source = "codecraftai" }
pyyaml = "^6.0.2"


[tool.poetry.group.dev.dependencies]
hypothesis = ">=6.0.0"

[tool.poetry.scripts]
testbase = "ccai.testbase.cli.testbase_command:testbase_root_command"

[[tool.poetry.source]]
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
